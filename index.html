<!doctype html>
<html>
  <title>Happy Valentines Pookieeeeee!!</title>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hearts">
      <div class="heart" style="left: 10%; animation-duration: 8s"></div>
      <div class="heart" style="left: 25%; animation-duration: 6s"></div>
      <div class="heart" style="left: 40%; animation-duration: 10s"></div>
      <div class="heart" style="left: 55%; animation-duration: 7s"></div>
      <div class="heart" style="left: 70%; animation-duration: 9s"></div>
      <div class="heart" style="left: 85%; animation-duration: 6s"></div>
    </div>

    <div class="container">
      <h1 class="question" id="head">Will You Be My Valentine?</h1>

      <img id="pic" class="img" src="cat.gif" />

      <div class="buttons">
        <button id="yes" class="yes" onclick="clickYes()">Yes</button>
        <button id="no" class="no" onclick="clickNo()">No</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
